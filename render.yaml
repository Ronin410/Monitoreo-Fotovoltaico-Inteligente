# Blueprint de Render (ver specs/01-arquitectura.md §Despliegue y docs/despliegue-render.md).
# Este archivo es el de STAGING. Producción usa render.production.yaml (docs/produccion-render.md);
# al cambiar uno, aplique el mismo cambio en el otro.
#
# Un grupo de variables solo admite valores fijos (`value`) o generados (`generateValue`): las
# referencias (`fromService`, `fromDatabase`) y las que se capturan a mano (`sync: false`) van en
# cada servicio. pv-api y pv-worker validan todas las variables al arrancar, por eso ambos llevan
# los mismos secretos: al crear el Blueprint, Render los pide una vez por servicio.

envVarGroups:
  - name: pv-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      # Se generan una vez y los comparten pv-api y pv-worker.
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CREDENTIALS_KEY_VERSION
        value: '1'
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL_CHAT
        value: claude-sonnet-5-5
      - key: LLM_MODEL_FAST
        value: claude-haiku-5-5
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: EMAIL_PROVIDER
        value: resend
      - key: STORAGE_PROVIDER
        value: s3
      - key: DEFAULT_TIMEZONE
        value: America/Mazatlan

services:
  - type: web
    name: pv-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pv/api build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @pv/api start
    healthCheckPath: /health
    envVars:
      - fromGroup: pv-shared
      # Rol dueño: solo para las migraciones del preDeploy.
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: pv-db
          property: connectionString
      # Usuarios de conexión miembros de pv_app y pv_service (sin BYPASSRLS). Se crean después de
      # la primera migración (docs/despliegue-render.md, paso 3); al crear el Blueprint se deja
      # un valor provisional.
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_DATABASE_URL
        sync: false
      # URL pública de pv-web (https://…). API_URL lleva el mismo valor: el web reenvía /api a
      # pv-api (specs/PREGUNTAS.md #24) y los logos se sirven por ese /api.
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # 32 bytes en base64 (openssl rand -base64 32), el mismo en pv-api y pv-worker. Se respalda
      # fuera de Render: si se pierde, las credenciales de inversor no se pueden descifrar.
      - key: CREDENTIALS_ENC_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # "true" solo en staging/demo; "false" en producción.
      - key: SIMULATOR_ENABLED
        sync: false

  - type: worker
    name: pv-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pv/worker build
    startCommand: pnpm --filter @pv/worker start
    envVars:
      - fromGroup: pv-shared
      # Los mismos valores que en pv-api.
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CREDENTIALS_ENC_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: SIMULATOR_ENABLED
        sync: false

  - type: web
    name: pv-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pv/web build
    startCommand: pnpm --filter @pv/web start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      # El web reenvía /api a pv-api por la red privada de Render (specs/PREGUNTAS.md #24).
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: pv-api
          property: hostport
      # Contacto de la página pública /inicio (opcionales; se leen al compilar). Correo y número de
      # WhatsApp con lada, por ejemplo 526671234567. Sin ellos la página dice que se publicarán pronto.
      - key: NEXT_PUBLIC_CONTACT_EMAIL
        sync: false
      - key: NEXT_PUBLIC_CONTACT_WHATSAPP
        sync: false

databases:
  - name: pv-db
    databaseName: pv_iot
    plan: basic-256mb
    postgresMajorVersion: '16'
