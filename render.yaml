# Blueprint de Render (ver specs/01-arquitectura.md §Despliegue).
# Crear un Blueprint por ambiente (staging y production) apuntando a este archivo.
# Las variables con `sync: false` se capturan a mano en el panel de Render.

envVarGroups:
  - name: pv-shared
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      # El web reenvía /api a pv-api por la red privada de Render (specs/PREGUNTAS.md #24): el
      # navegador ve un solo origen y la cookie de refresh es del mismo sitio. En pv-shared,
      # API_URL debe ser igual a APP_URL (los logos se sirven por ese mismo /api).
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: pv-api
          property: hostport
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      # 32 bytes en base64 (openssl rand -base64 32). Se captura a mano y se respalda fuera
      # de Render: si se pierde, las credenciales de inversor guardadas no se pueden descifrar.
      - key: CREDENTIALS_ENC_KEY
        sync: false
      - key: CREDENTIALS_KEY_VERSION
        value: '1'
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL_CHAT
        value: claude-sonnet-5-5
      - key: LLM_MODEL_FAST
        value: claude-haiku-5-5
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # true solo en staging/demo.
      - key: SIMULATOR_ENABLED
        sync: false
      - key: DEFAULT_TIMEZONE
        value: America/Mazatlan

services:
  - type: web
    name: pv-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pv/api build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @pv/api start
    healthCheckPath: /health
    envVars:
      # Rol dueño: solo para las migraciones del preDeploy.
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: pv-db
          property: connectionString
      # Usuario miembro de pv_app (sin BYPASSRLS); se crea tras la primera migración
      # (ver packages/db/README.md) y se captura a mano.
      - key: DATABASE_URL
        sync: false
      # Usuario miembro de pv_service (ver packages/db/README.md).
      - key: SERVICE_DATABASE_URL
        sync: false
      - fromGroup: pv-shared

  - type: worker
    name: pv-worker
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pv/worker build
    startCommand: pnpm --filter @pv/worker start
    envVars:
      # Mismo usuario miembro de pv_app que pv-api.
      - key: DATABASE_URL
        sync: false
      # Usuario miembro de pv_service (ver packages/db/README.md).
      - key: SERVICE_DATABASE_URL
        sync: false
      - fromGroup: pv-shared

  - type: web
    name: pv-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @pv/web build
    startCommand: pnpm --filter @pv/web start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      # El web reenvía /api a pv-api por la red privada de Render (specs/PREGUNTAS.md #24): el
      # navegador ve un solo origen y la cookie de refresh es del mismo sitio. En pv-shared,
      # API_URL debe ser igual a APP_URL (los logos se sirven por ese mismo /api).
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: pv-api
          property: hostport

databases:
  - name: pv-db
    databaseName: pv_iot
    plan: basic-256mb
    postgresMajorVersion: '16'
